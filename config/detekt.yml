build:
  maxIssues: 50
  weights:
    complexity: 2
    style: 1
    potential-bugs: 2
    performance: 2
  excludes: '**/build/**,**/generated/**'

config:
  validation: true

processors:
  active: true
  exclude:
    - 'FunctionCountProcessor'

console-reports:
  active: true
  exclude:
    - 'ComplexityReport'

comments:
  active: true
  CommentOverPrivateFunction:
    active: true

complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 15
  LargeClass:
    active: true
    threshold: 300
  LongMethod:
    active: true
    threshold: 25
  NestedBlockDepth:
    active: true
    threshold: 4

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: false
  EmptyCatchBlock:
    active: true

naming:
  active: true
  ClassNaming:
    active: true
    excludes: ['.*Screen$', '.*ViewModel$']
  FunctionNaming:
    active: false
  VariableNaming:
    active: true

performance:
  active: true
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  UnsafeCast:
    active: true

style:
  active: true
  MagicNumber:
    active: false
  DataClassContainsFunctions:
    active: true
  OptionalUnit:
    active: true
  ReturnCount:
    active: true
